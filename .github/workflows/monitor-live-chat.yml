name: Monitor live chat production

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/site.js'
      - 'assets/js/ensuite-chat-widget.js'
      - '.github/workflows/monitor-live-chat.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-live-chat-production
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe website and own live chat
        shell: bash
        run: |
          set -u
          SITE='https://www.en-suite.co.uk'
          WORKER='https://en-suite-bathrooms.nicholas-griffith-uk.workers.dev'

          site_code=$(curl -L -sS --connect-timeout 10 --max-time 20 -o /tmp/site.html -w '%{http_code}' "$SITE/" || true)
          js_code=$(curl -L -sS --connect-timeout 10 --max-time 20 -o /tmp/site.js -w '%{http_code}' "$SITE/assets/js/site.js" || true)
          widget_code=$(curl -L -sS --connect-timeout 10 --max-time 20 -o /tmp/widget.js -w '%{http_code}' "$SITE/assets/js/ensuite-chat-widget.js" || true)
          health_code=$(curl -L -sS --connect-timeout 10 --max-time 20 -o /tmp/health.json -w '%{http_code}' "$WORKER/health" || true)

          echo "website=$site_code site_js=$js_code widget=$widget_code api_health=$health_code"

          [ "$site_code" = '200' ] || { echo 'Website is unavailable'; exit 1; }
          [ "$js_code" = '200' ] || { echo 'Website JavaScript is unavailable'; exit 1; }
          [ "$widget_code" = '200' ] || { echo 'First-party chat widget is unavailable'; exit 1; }
          [ "$health_code" = '200' ] || { echo 'Own chat API is unavailable'; exit 1; }

          grep -q '/assets/js/ensuite-chat-widget.js' /tmp/site.js \
            || { echo 'First-party chat widget is missing'; exit 1; }

          grep -q '/api/conversations' /tmp/widget.js \
            || { echo 'Live chat API wiring is missing'; exit 1; }

          grep -q '/api/site-visit' /tmp/widget.js \
            || { echo 'Visitor notification wiring is missing'; exit 1; }

          if grep -Eqi 'tawk|navigator\.webdriver|document\.referrer|Node\.prototype\.insertBefore' /tmp/site.js /tmp/widget.js; then
            echo 'Prohibited external chat or crawler-evasion code returned'
            exit 1
          fi

          echo 'Production website, own chat and visitor notifications are healthy'
