name: Monitor live chat production

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/site.js'
      - 'index.html'
      - '.github/workflows/monitor-live-chat.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-live-chat-production
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe website and Tawk live chat
        shell: bash
        run: |
          set -u
          SITE='https://www.en-suite.co.uk'
          TAWK='https://embed.tawk.to/6a2161974a36f41c2edf02c6/1jq96ae0j'

          site_code=$(curl -L -sS --connect-timeout 10 --max-time 20 -o /tmp/site.html -w '%{http_code}' "$SITE/" || true)
          js_code=$(curl -L -sS --connect-timeout 10 --max-time 20 -o /tmp/site.js -w '%{http_code}' "$SITE/assets/js/site.js" || true)
          tawk_code=$(curl -L -sS --connect-timeout 10 --max-time 20 -o /tmp/tawk.js -w '%{http_code}' "$TAWK" || true)

          echo "website=$site_code site_js=$js_code tawk=$tawk_code"

          [ "$site_code" = '200' ] || { echo 'Website is unavailable'; exit 1; }
          [ "$js_code" = '200' ] || { echo 'Website JavaScript is unavailable'; exit 1; }
          [ "$tawk_code" = '200' ] || { echo 'Tawk live chat is unavailable'; exit 1; }

          grep -q 'embed.tawk.to/6a2161974a36f41c2edf02c6/1jq96ae0j' /tmp/site.js \
            || { echo 'Standard Tawk property is missing'; exit 1; }

          if grep -Eq 'workers\.dev|navigator\.webdriver|Node\.prototype\.insertBefore|TAWK_PATTERN' /tmp/site.js; then
            echo 'Obsolete custom Worker or script-blocking code returned'
            exit 1
          fi

          grep -q 'Tawk_API' /tmp/tawk.js \
            || { echo 'Tawk property response is unexpected'; exit 1; }

          echo 'Production website and standard live chat are healthy'
