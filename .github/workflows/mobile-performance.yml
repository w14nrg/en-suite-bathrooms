name: Build mobile-optimized image assets

on:
  push:
    branches:
      - performance/mobile-speed-20261008
    paths:
      - scripts/optimize_mobile.py
      - .github/workflows/mobile-performance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    name: Optimize images and verify SEO markup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Optimize responsive image assets and fonts
        run: python scripts/optimize_mobile.py
      - name: Confirm all protected SEO markup remained identical
        run: |
          git diff --check
          git status --short
      - name: Save optimized assets to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html bathroom-renovations-fulham.html projects.html project-lille-road-fulham.html project-rosaline-road-fulham.html assets/css/site.css assets/perf assets/fonts assets/projects assets/shop
          if ! git diff --cached --quiet; then
            git commit -m "Optimize mobile image delivery and remove render-blocking web fonts"
            git push origin HEAD:performance/mobile-speed-20261008
          else
            echo "No performance changes needed"
          fi
