name: Audit live chat production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-live-chat.yml'
      - 'assets/js/site.js'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit public website and standard live chat
        shell: bash
        run: |
          set -u
          fail=0
          SITE='https://www.en-suite.co.uk'
          TAWK='https://embed.tawk.to/6a2161974a36f41c2edf02c6/1jq96ae0j'

          check_url() {
            name="$1"
            url="$2"
            out="$3"
            code=$(curl -L -sS --connect-timeout 15 --max-time 30 -o "$out" -w '%{http_code}' "$url" || true)
            echo "$name HTTP $code"
            if [ "$code" != '200' ]; then fail=1; fi
          }

          check_url 'Website' "$SITE/" site.html
          check_url 'Website JavaScript' "$SITE/assets/js/site.js" site.js
          check_url 'Tawk live chat' "$TAWK" tawk.js

          grep -q 'embed.tawk.to/6a2161974a36f41c2edf02c6/1jq96ae0j' site.js \
            && echo 'PASS standard Tawk property is installed' \
            || { echo 'FAIL standard Tawk property missing'; fail=1; }

          if grep -Eq 'workers\.dev|navigator\.webdriver|Node\.prototype\.insertBefore|TAWK_PATTERN' site.js; then
            echo 'FAIL obsolete custom Worker or script-blocking code is present'
            fail=1
          else
            echo 'PASS no custom Worker or script-blocking code'
          fi

          if grep -q 'ensuiteChatFallback' site.html; then
            echo 'FAIL obsolete duplicate chat fallback is present'
            fail=1
          else
            echo 'PASS no duplicate chat fallback'
          fi

          grep -q 'Tawk_API' tawk.js \
            && echo 'PASS Tawk property script is responding' \
            || { echo 'FAIL Tawk property script response is unexpected'; fail=1; }

          echo "AUDIT_FAIL=$fail"
          exit "$fail"
