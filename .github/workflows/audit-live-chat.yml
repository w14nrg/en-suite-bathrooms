name: Audit live chat production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-live-chat.yml'
      - 'assets/js/site.js'
      - 'assets/js/ensuite-chat-widget.js'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit public website and own live chat
        shell: bash
        run: |
          set -u
          fail=0
          SITE='https://www.en-suite.co.uk'
          WORKER='https://en-suite-bathrooms.nicholas-griffith-uk.workers.dev'

          check_url() {
            name="$1"
            url="$2"
            out="$3"
            code=$(curl -L -sS --connect-timeout 15 --max-time 30 -o "$out" -w '%{http_code}' "$url" || true)
            echo "$name HTTP $code"
            if [ "$code" != '200' ]; then fail=1; fi
          }

          check_url 'Website' "$SITE/" site.html
          check_url 'Website JavaScript' "$SITE/assets/js/site.js" site.js
          check_url 'First-party chat widget' "$SITE/assets/js/ensuite-chat-widget.js" widget.js
          check_url 'Chat API health' "$WORKER/health" health.json

          grep -q '/assets/js/ensuite-chat-widget.js' site.js \
            && echo 'PASS first-party chat widget is installed' \
            || { echo 'FAIL first-party chat widget missing'; fail=1; }

          grep -q 'en-suite-bathrooms.nicholas-griffith-uk.workers.dev' site.js \
            && echo 'PASS own chat API is configured' \
            || { echo 'FAIL own chat API missing'; fail=1; }

          if grep -Eqi 'tawk|navigator\.webdriver|document\.referrer|Node\.prototype\.insertBefore' site.js widget.js; then
            echo 'FAIL prohibited external chat or crawler-evasion code is present'
            fail=1
          else
            echo 'PASS no prohibited external chat or crawler-evasion code'
          fi

          grep -q '/api/site-visit' widget.js \
            && echo 'PASS visitor notifications are wired' \
            || { echo 'FAIL visitor notifications missing'; fail=1; }

          grep -q '/api/conversations' widget.js \
            && echo 'PASS live chat API is wired' \
            || { echo 'FAIL live chat API missing'; fail=1; }

          echo "AUDIT_FAIL=$fail"
          exit "$fail"
