name: Deploy chat worker

on:
  push:
    branches: [main]
    paths:
      - 'ensuite-chat-webpush-patch/worker/**'
      - '.github/workflows/deploy-chat-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ensuite-chat-webpush-patch/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ensuite-chat-webpush-patch/worker/package.json
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is not configured" && exit 1)
      - name: Install worker dependencies
        run: npm install --no-audit --no-fund
      - name: Deploy production worker
        run: npx wrangler deploy
