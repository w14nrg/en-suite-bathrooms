name: Site tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Draft 4 JavaScript syntax
        run: |
          node --check assets/js/estimator-draft4-core.mjs
          node --check assets/js/estimator-draft4-store.mjs
          node --check assets/js/estimator-draft4-render.mjs
          node --check assets/js/estimator-draft4-app.mjs
          node --check functions/api/product-preview.js
      - name: Run tests
        run: npm test
