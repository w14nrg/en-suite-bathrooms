name = "ensuite-live-chat"
main = "src/index.js"
compatibility_date = "2026-07-23"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "ensuite-live-chat-db"
database_id = "PASTE_D1_DATABASE_ID_HERE"

[triggers]
crons = ["* * * * *"]

[vars]
BUSINESS_NAME = "En-Suites & Bathrooms"
OWNER_NAME = "Nicholas"
SITE_ORIGINS = "https://en-suite.co.uk,https://www.en-suite.co.uk"
PUBLIC_CHAT_URL = "https://chat.en-suite.co.uk/inbox.html"
FIREBASE_API_KEY = "PASTE_FIREBASE_WEB_API_KEY"
FIREBASE_AUTH_DOMAIN = "PASTE_PROJECT_ID.firebaseapp.com"
FIREBASE_PROJECT_ID = "PASTE_FIREBASE_PROJECT_ID"
FIREBASE_STORAGE_BUCKET = "PASTE_PROJECT_ID.firebasestorage.app"
FIREBASE_MESSAGING_SENDER_ID = "PASTE_MESSAGING_SENDER_ID"
FIREBASE_APP_ID = "PASTE_FIREBASE_APP_ID"
FIREBASE_VAPID_KEY = "PASTE_WEB_PUSH_CERTIFICATE_KEY_PAIR"
