<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#102a43">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <title>En-Suite Leads</title>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#1f2933;background:#dfe5e7;--navy:#102a43;--navy2:#163f5f;--green:#25d366;--chat:#efeae2;--mine:#d9fdd3;--line:#d9e2ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden}button,input,textarea,select{font:inherit}.hidden{display:none!important}
    .login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,var(--navy) 0 220px,#e9edef 220px)}.login-card{width:min(430px,100%);background:#fff;border-radius:16px;padding:28px;box-shadow:0 15px 50px rgba(0,0,0,.2)}.brand{display:flex;gap:13px;align-items:center}.brand-icon{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:800}.login h1{font-size:22px;margin:0}.login p{color:#627d98}.login input{width:100%;padding:13px;border:1px solid #bcccdc;border-radius:9px;margin:10px 0}.primary{border:0;background:var(--navy);color:#fff;padding:11px 15px;border-radius:9px;font-weight:700;cursor:pointer}.primary:disabled{opacity:.5;cursor:not-allowed}
    .app{height:100dvh;display:grid;grid-template-columns:380px 1fr;background:#fff}.sidebar{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.side-head{background:var(--navy);color:#fff;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}.side-title{display:flex;align-items:center;gap:10px}.side-avatar{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-size:12px;font-weight:800}.side-head h1{font-size:16px;margin:0}.side-head small{opacity:.82}.side-tools{display:flex;gap:6px}.icon-btn{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:8px;cursor:pointer}.push-bar{padding:10px 12px;background:#fff7d6;border-bottom:1px solid #eadfa6;font-size:13px;display:flex;align-items:center;gap:8px;justify-content:space-between}.push-bar.success{background:#e6f7ec;border-color:#b7e4c7}.push-bar button{border:0;background:var(--navy);color:#fff;border-radius:7px;padding:7px 9px;font-weight:700;cursor:pointer}.filter{padding:9px 12px;background:#fff}.filter input{width:100%;border:0;background:#f0f2f5;border-radius:9px;padding:10px 12px;outline:none}.conversation-list{overflow:auto;flex:1}.conversation{padding:12px 14px;border-top:1px solid #edf1f4;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:5px 10px}.conversation:hover,.conversation.active{background:#f0f2f5}.conversation-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conversation-time{font-size:11px;color:#829ab1}.conversation-preview{font-size:13px;color:#627d98;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{background:#c53030;color:#fff;border-radius:999px;min-width:21px;height:21px;display:grid;place-items:center;font-size:11px;padding:0 6px}.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#25d366;margin-right:4px}
    .main{display:flex;flex-direction:column;min-width:0;background:var(--chat)}.main-empty{margin:auto;text-align:center;color:#627d98;padding:30px}.main-empty img{width:90px;height:90px;border-radius:50%;opacity:.92}.chat-view{height:100%;display:flex;flex-direction:column}.main-head{background:#f0f2f5;border-bottom:1px solid #d7dee7;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px}.chat-person{display:flex;align-items:center;gap:10px;min-width:0}.chat-avatar{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800}.chat-title-wrap{min-width:0}.chat-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-meta{font-size:12px;color:#627d98;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58vw}.actions{display:flex;gap:7px;align-items:center}.actions button,.actions select,.whatsapp-btn{border:1px solid #bcccdc;background:#fff;color:#243b53;padding:8px 9px;border-radius:8px;cursor:pointer;text-decoration:none;font-size:13px}.actions .live{background:var(--navy);color:#fff;border-color:var(--navy)}.whatsapp-btn{background:#25d366;color:#063b1b;border-color:#20bd5a;font-weight:700}.messages{flex:1;overflow:auto;padding:18px 6%;background-color:var(--chat);background-image:radial-gradient(rgba(16,42,67,.035) 1px,transparent 1px);background-size:12px 12px}.msg-row{display:flex;margin-bottom:6px}.msg-row.customer{justify-content:flex-end}.msg{max-width:min(72%,650px);padding:8px 10px 6px;border-radius:8px;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.08);white-space:pre-wrap;word-break:break-word}.msg-row.customer .msg,.msg-row.owner .msg{background:var(--mine)}.msg-row.owner{justify-content:flex-start}.msg-row.system{justify-content:center}.msg-row.system .msg{font-size:12px;color:#486581;background:#fff7d6;text-align:center}.msg-time{display:block;font-size:10px;color:#829ab1;text-align:right;margin-top:4px}.reply{display:flex;align-items:flex-end;gap:8px;background:#f0f2f5;border-top:1px solid #d9e2ec;padding:10px 12px}.reply textarea{flex:1;resize:none;border:0;border-radius:22px;padding:12px 15px;min-height:44px;max-height:110px;outline:none}.send{border:0;width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;font-size:18px;cursor:pointer}.mobile-back{display:none}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#102a43;color:#fff;padding:11px 16px;border-radius:9px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:9999;max-width:90vw}.install-note{font-size:11px;opacity:.82;margin-top:2px}
    @media(max-width:820px){body{overflow:hidden}.app{grid-template-columns:1fr}.sidebar{height:100dvh}.main{display:none;height:100dvh}.app.chat-open .sidebar{display:none}.app.chat-open .main{display:flex}.mobile-back{display:inline-grid;place-items:center;border:0;background:transparent;font-size:22px;padding:4px}.chat-meta{max-width:54vw}.actions select{display:none}.messages{padding:15px 10px}.msg{max-width:84%}.main-head{padding:8px}.actions button,.whatsapp-btn{padding:7px 8px;font-size:12px}.chat-avatar{width:36px;height:36px}.reply{padding-bottom:calc(10px + env(safe-area-inset-bottom))}}
  </style>
</head>
<body>
  <section id="login" class="login">
    <div class="login-card">
      <div class="brand"><div class="brand-icon">E&amp;B</div><div><h1>En-Suite Leads</h1><small>Website chat inbox</small></div></div>
      <p>Sign in to receive and answer website enquiries.</p>
      <form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="Admin password" required><button class="primary" type="submit">Sign in</button></form>
      <p id="loginError" style="color:#b91c1c"></p>
    </div>
  </section>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <header class="side-head">
        <div class="side-title"><div class="side-avatar">E&amp;B</div><div><h1>Website enquiries</h1><small><span class="status-dot"></span>Live inbox open</small><div id="installText" class="install-note"></div></div></div>
        <div class="side-tools"><button id="installButton" class="icon-btn hidden" title="Install app">Install</button><button id="logoutButton" class="icon-btn" title="Log out">Log out</button></div>
      </header>
      <div id="pushBar" class="push-bar"><span id="pushText">Enable phone alerts so no lead is missed.</span><button id="enablePushButton">Enable alerts</button></div>
      <div class="filter"><input id="filterInput" type="search" placeholder="Search enquiries"></div>
      <div id="conversationList" class="conversation-list"></div>
    </aside>

    <main class="main">
      <div id="emptyState" class="main-empty"><img src="/icon-192.png" alt=""><h2>Select an enquiry</h2><p>New website chats will appear here.</p></div>
      <section id="chatView" class="chat-view hidden">
        <header class="main-head">
          <div class="chat-person"><button id="backButton" class="mobile-back" aria-label="Back">←</button><div class="chat-avatar" id="chatAvatar">?</div><div class="chat-title-wrap"><div id="chatTitle" class="chat-title">Website visitor</div><div id="chatMeta" class="chat-meta"></div></div></div>
          <div class="actions"><a id="customerWhatsApp" class="whatsapp-btn hidden" target="_blank" rel="noopener">WhatsApp</a><button id="takeoverButton" class="live">Take over</button><select id="statusSelect"><option value="open">Open</option><option value="survey-booked">Survey booked</option><option value="quoting">Quoting</option><option value="won">Won</option><option value="lost">Lost</option><option value="closed">Closed</option></select></div>
        </header>
        <div id="messages" class="messages"></div>
        <form id="replyForm" class="reply"><textarea id="replyText" rows="1" placeholder="Message as Nicholas" disabled></textarea><button id="sendButton" class="send" type="submit" disabled aria-label="Send">➤</button></form>
      </section>
    </main>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-messaging-compat.js"></script>
  <script>
    const state = { selected:null, conversations:[], lastUnreadTotal:0, pushToken:null, installPrompt:null, timersStarted:false };
    const login = document.getElementById('login');
    const app = document.getElementById('app');
    const list = document.getElementById('conversationList');
    const messages = document.getElementById('messages');
    const replyText = document.getElementById('replyText');
    const sendButton = document.getElementById('sendButton');
    const chatView = document.getElementById('chatView');
    const emptyState = document.getElementById('emptyState');
    const pushBar = document.getElementById('pushBar');
    const pushText = document.getElementById('pushText');
    const enablePushButton = document.getElementById('enablePushButton');

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      state.installPrompt = event;
      document.getElementById('installButton').classList.remove('hidden');
      document.getElementById('installText').textContent = 'Install this like an app';
    });

    window.addEventListener('appinstalled', () => {
      document.getElementById('installButton').classList.add('hidden');
      document.getElementById('installText').textContent = 'Installed on this device';
      state.installPrompt = null;
    });

    document.getElementById('installButton').addEventListener('click', async () => {
      if (!state.installPrompt) return;
      state.installPrompt.prompt();
      await state.installPrompt.userChoice;
      state.installPrompt = null;
    });

    document.getElementById('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const response = await fetch('/api/admin/login', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ password:document.getElementById('password').value }) });
      if (!response.ok) { document.getElementById('loginError').textContent = 'Incorrect password.'; return; }
      await showApp();
    });

    document.getElementById('logoutButton').addEventListener('click', async () => { await fetch('/api/admin/logout', { method:'POST' }); location.reload(); });
    document.getElementById('backButton').addEventListener('click', () => app.classList.remove('chat-open'));
    document.getElementById('filterInput').addEventListener('input', renderList);
    enablePushButton.addEventListener('click', enablePush);

    document.getElementById('takeoverButton').addEventListener('click', async () => {
      if (!state.selected) return;
      await fetch('/api/admin/conversations/' + state.selected + '/takeover', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ mode:'human' }) });
      await loadConversation(state.selected, true);
      await loadList();
    });

    document.getElementById('statusSelect').addEventListener('change', async event => {
      if (!state.selected) return;
      await fetch('/api/admin/conversations/' + state.selected + '/status', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ status:event.target.value }) });
      await loadList();
    });

    replyText.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); document.getElementById('replyForm').requestSubmit(); }
    });

    document.getElementById('replyForm').addEventListener('submit', async event => {
      event.preventDefault();
      const body = replyText.value.trim();
      if (!body || !state.selected) return;
      replyText.value = '';
      const response = await fetch('/api/admin/conversations/' + state.selected + '/reply', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ body }) });
      if (!response.ok) { replyText.value = body; showToast('Message did not send. Try again.'); return; }
      await loadConversation(state.selected, true);
      await loadList();
    });

    async function showApp() {
      login.classList.add('hidden');
      app.classList.remove('hidden');
      await heartbeat();
      await loadList();
      await updatePushState();
      if (!state.timersStarted) {
        state.timersStarted = true;
        setInterval(heartbeat, 30000);
        setInterval(loadList, 3000);
        setInterval(() => { if (state.selected) loadConversation(state.selected, false); }, 2200);
      }
      const target = new URLSearchParams(location.search).get('chat');
      if (target) await selectConversation(target);
    }

    async function heartbeat() {
      const response = await fetch('/api/admin/heartbeat', { method:'POST' });
      if (response.status === 401) location.reload();
    }

    async function loadList() {
      const response = await fetch('/api/admin/conversations');
      if (response.status === 401) { login.classList.remove('hidden'); app.classList.add('hidden'); return; }
      const data = await response.json();
      state.conversations = data.conversations || [];
      renderList();
      const total = state.conversations.reduce((sum, conversation) => sum + Number(conversation.unread || 0), 0);
      document.title = total ? '(' + total + ') En-Suite Leads' : 'En-Suite Leads';
      if (total > state.lastUnreadTotal) beep();
      state.lastUnreadTotal = total;
    }

    function renderList() {
      const query = document.getElementById('filterInput').value.trim().toLowerCase();
      const filtered = state.conversations.filter(conversation => JSON.stringify(conversation).toLowerCase().includes(query));
      list.innerHTML = '';
      filtered.forEach(conversation => {
        const element = document.createElement('div');
        element.className = 'conversation' + (state.selected === conversation.id ? ' active' : '');
        const name = conversation.customer_name || conversation.project_type || 'New website visitor';
        const preview = conversation.project_brief || conversation.contact || 'Waiting for details';
        element.innerHTML = '<div class="conversation-name">' + escapeHtml(name) + '</div><div class="conversation-time">' + escapeHtml(shortTime(conversation.updated_at)) + '</div><div class="conversation-preview">' + escapeHtml([conversation.postcode, preview].filter(Boolean).join(' · ')) + '</div>' + (conversation.unread ? '<div class="badge">' + Number(conversation.unread) + '</div>' : '<div></div>');
        element.addEventListener('click', () => selectConversation(conversation.id));
        list.appendChild(element);
      });
      if (!filtered.length) list.innerHTML = '<div style="padding:25px;color:#627d98;text-align:center">No enquiries found.</div>';
    }

    async function selectConversation(id) {
      state.selected = id;
      app.classList.add('chat-open');
      chatView.classList.remove('hidden');
      emptyState.classList.add('hidden');
      replyText.disabled = false;
      sendButton.disabled = false;
      await fetch('/api/admin/conversations/' + id + '/acknowledge', { method:'POST' });
      await loadConversation(id, true);
      await loadList();
      replyText.focus();
    }

    async function loadConversation(id, scroll) {
      const response = await fetch('/api/admin/conversations/' + id + '/messages');
      if (!response.ok) return;
      const data = await response.json();
      const conversation = data.conversation;
      const name = conversation.customer_name || conversation.project_type || 'Website visitor';
      document.getElementById('chatTitle').textContent = name;
      document.getElementById('chatAvatar').textContent = initials(name);
      document.getElementById('chatMeta').textContent = [conversation.contact, conversation.postcode, conversation.project_type, conversation.timing].filter(Boolean).join(' · ');
      document.getElementById('statusSelect').value = conversation.status;
      document.getElementById('takeoverButton').textContent = conversation.mode === 'human' ? 'You are live' : 'Take over';
      configureCustomerWhatsApp(conversation.contact, name);
      messages.innerHTML = '';
      (data.messages || []).forEach(message => {
        const row = document.createElement('div');
        row.className = 'msg-row ' + message.sender;
        const bubble = document.createElement('div');
        bubble.className = 'msg';
        const body = document.createElement('span');
        body.textContent = message.body;
        const time = document.createElement('span');
        time.className = 'msg-time';
        time.textContent = shortTime(message.created_at);
        bubble.append(body, time);
        row.appendChild(bubble);
        messages.appendChild(row);
      });
      if (scroll) messages.scrollTop = messages.scrollHeight;
    }

    function configureCustomerWhatsApp(contact, name) {
      const link = document.getElementById('customerWhatsApp');
      const number = normaliseUkPhone(contact || '');
      if (!number) { link.classList.add('hidden'); link.removeAttribute('href'); return; }
      const text = 'Hi ' + name + ', Nicholas here from En-Suites & Bathrooms. Thanks for contacting us through the website.';
      link.href = 'https://wa.me/' + number + '?text=' + encodeURIComponent(text);
      link.classList.remove('hidden');
    }

    async function updatePushState() {
      if (!('Notification' in window) || !('serviceWorker' in navigator)) {
        pushText.textContent = 'This browser cannot receive phone alerts.';
        enablePushButton.classList.add('hidden');
        return;
      }
      if (Notification.permission === 'granted' && localStorage.getItem('ensuite_push_token')) {
        state.pushToken = localStorage.getItem('ensuite_push_token');
        pushBar.classList.add('success');
        pushText.textContent = 'Phone alerts are enabled on this device.';
        enablePushButton.textContent = 'Test alert';
        enablePushButton.onclick = testPush;
        await initialiseForegroundPush();
      }
    }

    async function initialiseForegroundPush() {
      try {
        const config = await fetch('/push-config.json').then(response => response.json());
        if (!config.configured) return;
        if (!firebase.apps.length) firebase.initializeApp(config.firebaseConfig);
        const messaging = firebase.messaging();
        messaging.onMessage(payload => {
          beep();
          showToast(payload.data?.title || 'New website enquiry');
          loadList();
        });
      } catch {}
    }

    async function enablePush() {
      try {
        enablePushButton.disabled = true;
        pushText.textContent = 'Connecting phone alerts…';
        const configResponse = await fetch('/push-config.json');
        const config = await configResponse.json();
        if (!config.configured) throw new Error('Firebase has not been configured yet.');
        const registration = await navigator.serviceWorker.register('/push-sw.js', { scope:'/' });
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') throw new Error('Notifications were not allowed.');
        if (!firebase.apps.length) firebase.initializeApp(config.firebaseConfig);
        const messaging = firebase.messaging();
        const token = await messaging.getToken({ vapidKey:config.vapidKey, serviceWorkerRegistration:registration });
        if (!token) throw new Error('The phone did not return a notification token.');
        const response = await fetch('/api/admin/push-devices', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ token, device_name:navigator.userAgent.includes('Android') ? 'Nicholas Pixel' : 'Nicholas device' }) });
        if (!response.ok) throw new Error('The alert token could not be saved.');
        localStorage.setItem('ensuite_push_token', token);
        state.pushToken = token;
        await initialiseForegroundPush();
        pushBar.classList.add('success');
        pushText.textContent = 'Phone alerts are enabled on this device.';
        enablePushButton.textContent = 'Test alert';
        enablePushButton.onclick = testPush;
        await testPush();
      } catch (error) {
        pushText.textContent = error.message || 'Could not enable alerts.';
        showToast(error.message || 'Could not enable alerts.');
      } finally {
        enablePushButton.disabled = false;
      }
    }

    async function testPush() {
      enablePushButton.disabled = true;
      const response = await fetch('/api/admin/push-test', { method:'POST' });
      const data = await response.json().catch(() => ({}));
      enablePushButton.disabled = false;
      showToast(response.ok && data.sent > 0 ? 'Test alert sent to your phone.' : 'No active phone token found. Re-enable alerts.');
    }

    function normaliseUkPhone(value) {
      let digits = String(value).replace(/\D/g, '');
      if (digits.startsWith('00')) digits = digits.slice(2);
      if (digits.startsWith('0') && digits.length >= 10) digits = '44' + digits.slice(1);
      if (digits.startsWith('44') && digits.length >= 12) return digits;
      if (digits.length >= 10 && digits.length <= 15) return digits;
      return '';
    }

    function initials(value) { return String(value).split(/\s+/).filter(Boolean).slice(0,2).map(part => part[0]).join('').toUpperCase() || '?'; }
    function shortTime(value) { const date = new Date(value); if (Number.isNaN(date.getTime())) return ''; return date.toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }); }
    function beep() { try { const context = new (window.AudioContext || window.webkitAudioContext)(); const oscillator = context.createOscillator(); const gain = context.createGain(); oscillator.frequency.value = 880; gain.gain.value = .18; oscillator.connect(gain); gain.connect(context.destination); oscillator.start(); setTimeout(() => { oscillator.stop(); context.close(); }, 420); } catch {} }
    function showToast(message) { const toast = document.getElementById('toast'); toast.textContent = message; toast.classList.remove('hidden'); setTimeout(() => toast.classList.add('hidden'), 4500); }
    function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character])); }

    fetch('/api/admin/conversations').then(response => { if (response.ok) showApp(); });
  </script>
</body>
</html>
